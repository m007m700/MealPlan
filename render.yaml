services:
  - type: web
    name: mealplan-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mealplan-db
          property: connectionString
      - key: DATABASE_USERNAME
        value: root
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: mealplan-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080

databases:
  - name: mealplan-db
    databaseName: mealplan
    plan: free
